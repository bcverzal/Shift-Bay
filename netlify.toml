[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  external_node_modules = ["pdfjs-dist"]
  included_files = ["netlify/functions/pdf.worker.mjs"]

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/shift-bay-config.js"
  [headers.values]
    Cache-Control = "no-store"
